name: Access audit

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Roles and rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Audit access
        id: audit
        continue-on-error: true
        env:
          # Fine-grained PAT with "Administration: read" and "Metadata: read".
          # Without it the audit skips instead of failing every week.
          GH_TOKEN: ${{ secrets.ACCESS_AUDIT_TOKEN }}
          ACCESS_AUDIT_ALLOW_SKIP: "1"
        run: |
          set -o pipefail
          chmod +x scripts/audit-access.sh
          ./scripts/audit-access.sh | tee access-audit.txt

      - name: Open or update audit issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '(kein Bericht)';
            try {
              detail = fs.readFileSync('access-audit.txt', 'utf8').slice(-6000);
            } catch (e) {}
            const title = 'Access review required';
            const body = [
              'Der geplante Access-Audit hat Abweichungen zwischen ',
              '`.github/access-policy.json` und dem Repository gefunden.',
              '',
              '```',
              detail,
              '```',
              '',
              `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Vorgehen: [ACCESS_CONTROL.md](../blob/main/.github/ACCESS_CONTROL.md).'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'access',
              per_page: 50
            });
            const issue = existing.data.find(i => i.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['access', 'security']
              });
            }

      - name: Fail on drift
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Access drift detected. See the access review issue."
          exit 1
