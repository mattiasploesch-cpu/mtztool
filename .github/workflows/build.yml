name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    uses: ./.github/workflows/android-ci.yml
    with:
      play: true
      upload_artifacts: true
