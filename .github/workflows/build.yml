name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug, release and Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle executable
        run: chmod +x gradlew scripts/build-release.sh

      - name: Build
        run: |
          ./gradlew --no-daemon \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundlePlaystore \
            --stacktrace

      - name: Collect artifacts and checksums
        run: ./scripts/build-release.sh --checksums-only

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mtztool-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: mtztool-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/update.json
          if-no-files-found: warn
