name: Nightly

on:
  schedule:
    # Every night at 02:00 UTC. GitHub only runs schedules on the default
    # branch and may delay them during high load.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suffix:
        description: "Suffix ohne führenden Bindestrich (leer = nightly.YYYYMMDD)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve suffix
        env:
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          if [ -n "$INPUT_SUFFIX" ]; then
            suffix="$INPUT_SUFFIX"
          else
            suffix="nightly.$(date -u +%Y%m%d)"
          fi
          if [[ ! "$suffix" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Ungültiges Suffix: $suffix"
            exit 2
          fi
          echo "NIGHTLY_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Build nightly APKs
        run: |
          chmod +x gradlew scripts/build-nightly.sh
          ./scripts/build-nightly.sh "$NIGHTLY_SUFFIX"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtztool-${{ env.NIGHTLY_SUFFIX }}
          path: |
            dist/nightly/*.apk
            dist/nightly/SHA256SUMS
            dist/nightly/update.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="nightly"
          notes="Automatischer Nightly-Build vom $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7}).

          - Vorabversion: kein Support, nicht für den Alltag.
          - Enthält Debug- und Release-APK, SHA256SUMS und update.json.
          - Signatur: Release-Key, falls konfiguriert, sonst Debug-Key.
          - Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/nightly/* --clobber
          else
            gh release create "$tag" dist/nightly/* \
              --prerelease \
              --title "Nightly build" \
              --notes "$notes"
          fi
          gh release edit "$tag" --prerelease --title "Nightly build" --notes "$notes"
