name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            Der PR-Titel muss mit einem Großbuchstaben beginnen.
            Beispiel: "feat: Theme-Bibliothek hinzufügen"

  # One job builds debug, release, Play bundle and lint together. Compile,
  # lint and packaging must not trigger three separate full builds anymore.
  build:
    name: Build & lint
    uses: ./.github/workflows/android-ci.yml
    with:
      play: true
      upload_artifacts: false
