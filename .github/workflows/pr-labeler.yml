name: PR labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target is used only because the labeler reads changed file names
# through the API. This workflow never checks out or executes PR code.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by area
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
