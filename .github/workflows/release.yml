name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Versionssprung (auto = aus Conventional Commits)"
        type: choice
        options: [auto, major, minor, patch, security]
        default: auto
      draft:
        description: "Release als Draft anlegen"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release, changelog and patches
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only the owner may approve a signing run. Required reviewers are
    # configured by scripts/setup-github.sh.
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # 'tools' no longer exists in current SDK cmdline-tools; the runner
          # already has platforms/build-tools for compileSdk 36.
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version (automatic SemVer)
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$(python3 scripts/next-version.py --level "$BUMP" --format name)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungültige Version: $version"
            exit 2
          fi
          # A workflow_dispatch must never overwrite an existing release. The
          # version resolver now bumps from the newest tag, and this guard is
          # the last line of defence against duplicate v2.2.0 releases.
          if [ "$REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Release v$version existiert bereits. Bitte neue Commits mergen oder einen anderen Bump wählen."
            exit 2
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          previous="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v$version$" | head -1 || true)"
          previous="${previous#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Version: $version ($code), vorher: ${previous:-keine}"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signing key restored."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set; release will be debug-signed."
          fi

      - name: Build release artifacts
        env:
          MTZ_VERSION_NAME: ${{ steps.version.outputs.version }}
          MTZ_VERSION_CODE: ${{ steps.version.outputs.code }}
          MTZ_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/
          MTZ_GITHUB_CLIENT_ID: ${{ vars.MTZ_GITHUB_CLIENT_ID }}
          MTZ_GOOGLE_CLIENT_ID: ${{ vars.MTZ_GOOGLE_CLIENT_ID }}
        run: |
          chmod +x gradlew scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Generate changelog (categories, authors, PRs)
        run: |
          python3 scripts/changelog.py \
            --version "${{ steps.version.outputs.version }}" \
            --previous "${{ steps.version.outputs.previous }}" \
            --output-md dist/CHANGELOG.md \
            --output-json dist/changelog.json
          cat dist/CHANGELOG.md

      - name: Carry forward the update patch chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "Kein vorheriger Release-Tag – keine Patch-Kette."
            exit 0
          fi
          mkdir -p /tmp/previous-manifest
          gh release download "v$PREVIOUS" --pattern update.json \
            --dir /tmp/previous-manifest --clobber || true
          if [ ! -f /tmp/previous-manifest/update.json ]; then
            echo "::warning::Vorheriges update.json fehlt – Kette startet beim aktuellen Patch."
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          previous = os.environ["PREVIOUS"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/v{previous}/"
          with open("/tmp/previous-manifest/update.json", encoding="utf-8") as handle:
              old = json.load(handle)
          with open("dist/update.json", encoding="utf-8") as handle:
              current = json.load(handle)
          chain = []
          for item in old.get("patches", []) + ([old["patch"]] if old.get("patch") else []):
              if not item.get("url"):
                  continue
              item = dict(item)
              if not item["url"].startswith(("http://", "https://")):
                  item["url"] = base + item["url"].rstrip("/").split("/")[-1]
              key = (item.get("fromVersionCode"), item.get("toVersionCode"))
              if all((other.get("fromVersionCode"), other.get("toVersionCode")) != key for other in chain):
                  chain.append(item)
          current["patches"] = chain
          with open("dist/update.json", "w", encoding="utf-8") as handle:
              json.dump(current, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          print(f"{len(chain)} ältere Patch-Schritte übernommen.")
          PY

      - name: Build APK patch from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "Kein vorheriger Release-Tag – erster Release, kein Patch."
            exit 0
          fi
          mkdir -p /tmp/previous-apk
          gh release download "v$PREVIOUS" --pattern "*.apk" --dir /tmp/previous-apk --clobber || true
          old_apk="$(find /tmp/previous-apk -maxdepth 1 -name '*.apk' | head -1 || true)"
          new_apk="$(find dist -maxdepth 1 -name '*release*.apk' | head -1 || true)"
          if [ -z "$old_apk" ] || [ -z "$new_apk" ]; then
            echo "::warning::Vorherige APK oder neue Release-APK fehlt – kein Patch erzeugt."
            exit 0
          fi
          IFS=. read -r pmaj pmin ppat <<< "$PREVIOUS"
          old_code=$((pmaj * 10000 + pmin * 100 + ppat))
          python3 scripts/make-patch.py "$old_apk" "$new_apk" \
            "dist/patch-${old_code}-to-${CODE}.patch" \
            --from-version "$PREVIOUS" --to-version "$VERSION" \
            --from-code "$old_code" --to-code "$CODE" \
            --json-out "dist/patch-info.json"
          python3 scripts/add-patch.py dist/update.json "dist/patch-${old_code}-to-${CODE}.patch" \
            --from-code "$old_code" --to-code "$CODE" \
            --from-version "$PREVIOUS" --to-version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/"

      - name: Regenerate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          sha256sum *.apk *.aab *.json *.patch *.md > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: Upload patch and changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-patch
          path: |
            dist/*.patch
            dist/patch-info.json
            dist/changelog.json
            dist/CHANGELOG.md
            dist/SHA256SUMS
          if-no-files-found: warn

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MTZ Tool ${{ steps.version.outputs.version }}
          body_path: dist/CHANGELOG.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: false
          make_latest: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.patch
            dist/patch-info.json
            dist/changelog.json
            dist/CHANGELOG.md
            dist/SHA256SUMS
            dist/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
