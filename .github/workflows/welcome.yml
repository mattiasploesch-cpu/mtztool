name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Danke für dein erstes Issue! Bitte prüfe, ob alle Pflichtfelder
            ausgefüllt sind und ob Logs bzw. der Stacktrace beiliegen.
          pr_message: >
            Danke für deinen ersten Pull Request! Bitte stelle sicher, dass
            `./gradlew :app:assembleDebug` lokal läuft und die Checkliste im
            PR-Template ausgefüllt ist.
